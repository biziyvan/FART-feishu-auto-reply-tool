# ============================================
# 飞书自动回复 - 配置示例
# ============================================
# 使用方式：
#   1. 把本文件复制为 config.yaml
#   2. 填入你自己的飞书地址、会话名、API Key
#
# 或者不落盘密钥（推荐），改用环境变量：
#   FEISHU_BASE_URL / FEISHU_TARGET_CHAT / LLM_API_KEY / LLM_BASE_URL / LLM_MODEL
# ============================================

# 飞书网页版地址
# 从浏览器地址栏复制，形如 https://<你的租户>.feishu.cn/next/messenger/
feishu:
  base_url: "https://YOUR_TENANT.feishu.cn/next/messenger/"
  # 目标会话名称（左侧列表里显示的名字）
  target_chat_name: "AI教学平台"

# 浏览器设置
browser:
  # 浏览器通道：msedge = 微软 Edge / chrome = 谷歌 Chrome
  # 留空则使用 Playwright 自带 Chromium（需先 playwright install chromium）
  channel: "msedge"
  # 用户数据目录：登录态会保存在这里，登录一次后可长期复用
  user_data_dir: "./.browser_data"
  # 是否显示浏览器窗口（强烈建议 true，飞书对无头浏览器风控严格）
  headless: false
  # 慢动作（毫秒），方便观察每一步，调试用
  slow_mo: 200
  # 窗口大小
  viewport_width: 1440
  viewport_height: 900
  # 是否周期性把浏览器窗口提到前台（默认 false）
  #   false（推荐）：程序不抢你的焦点，前台可以照常做别的事
  #   true：每轮轮询都把飞书窗口提到最前，可略微降低页面被系统冻结的概率，
  #         但会每隔几秒打断你一次（这是旧版本的默认行为，仅按需开启）
  keep_front: false

# 轮询设置
polling:
  # 每轮检查间隔（秒）
  interval: 5
  # 随机抖动范围（秒），避免固定频率触发风控
  jitter: 2

# 上下文设置（关键：让 AI 看到题目原文和对话历史）
context:
  # 发送给 AI 的上下文消息条数上限（含触发消息本身）
  context_size: 30
  # 上下文最大字符数（控制 token 开支，超出则从最早的丢弃）
  max_chars: 3000
  # 内存消息池上限：程序把"历史 + 每轮读到的新消息"累积在内存里，
  # 连续运行数小时后会越来越大（每轮都要全量排序），且容易把很久以前的
  # 消息混进上下文。超过这个条数就裁剪到最近 N 条。一般无需修改。
  pool_max: 1200

# 回复策略
reply_strategy:
  # 只答最新一题（true=推荐）：
  #   机器人推了新题才回复；程序启动时的历史积压旧题一律跳过，不补答。
  #   false：从最新往回依次补答所有未答的题（会连续发很多条，慎用）。
  latest_only: true
  # 「请输入课程名」提示 → 自动回复的课程名。留空（""）则不自动回复。
  #   机器人偶尔会只发一句"如要开始学习，请输入课程名称（如「智能合约」）"，
  #   此时程序会自动回复下面这个课程名，开始/继续下一轮作答。
  auto_reply_course: "智能合约"
  # 同一条课程名提示在冷却期内不重复回复（秒），避免机器人重复推送时刷屏
  auto_reply_course_cooldown: 120

# 大模型设置（OpenAI 兼容接口；硅基流动 / DeepSeek 官方都能直接跑）
llm:
  # 接口类型：auto = 按下面的 base_url 自动识别（推荐，通常不用动）
  #   可选 auto / siliconflow / deepseek / openai / generic
  #   ⚠️ 只有当 base_url 指向自建中转网关（域名识别不出来）时，才需要手填，
  #      用来告诉程序该发哪一套参数。填错了也不要紧：以 base_url 识别的结果为准，
  #      程序会在启动日志里提示你改回 "auto"。
  provider: "auto"
  # 接口地址。改成 https://api.deepseek.com 即自动切换到 DeepSeek 官方那套参数
  #   硅基流动：https://api.siliconflow.cn/v1
  #   DeepSeek：https://api.deepseek.com/v1
  base_url: "https://api.siliconflow.cn/v1"
  # ★ 填入你自己的 API Key（或改用环境变量 LLM_API_KEY）
  api_key: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  # 可用模型
  #   硅基流动：Qwen/Qwen3.5-35B-A3B（理解力强、响应快，~1s）
  #             Qwen/Qwen2.5-72B-Instruct-128K、deepseek-ai/DeepSeek-V3
  #   DeepSeek：deepseek-flash（快）/ deepseek-v4-pro（强）
  model: "Qwen/Qwen3.5-35B-A3B"
  # 思考模式开关："enabled" 开 / "disabled" 关；删掉或留空则按接口自适应
  #   ⚠️ 答题场景请务必关闭：开思考又慢又贵，而且开启时 temperature 会失效。
  #      DeepSeek 官方**默认开启**思考，本程序检测到 DeepSeek 时会自动补上关闭参数。
  #   参数名自动适配：硅基流动发 enable_thinking，DeepSeek 发 thinking:{type:disabled}
  thinking: "disabled"
  # ↓ 旧写法，保留兼容（thinking 未填时才看它）。两行都不冲突，可只留一行。
  enable_thinking: false
  system_prompt: |
    你是答题助手，替学生回复「AI教学平台」教学机器人。

    我会把我和机器人的最近对话粘贴给你。请根据对话，判断学生下一条应该发送什么。

    【判断规则】
    - 对话中最后一条是机器人消息。要根据它判断该回什么。
    - 「AI 自适应问答」或「当前题目：」+ 题目（可能带 A/B/C/D 选项）→ 这是正式题目，给出答案。
    - 题干以「判断：」开头（要判断某个说法对/错）→ 判断题，**只回英文 true 或 false**。
    - 「学习反馈」+「答对了」→ 说明答对了，按其中的新要求作答（如"说说...""解释..."）。
    - 「学习反馈」+「答错了」+ 追问 → 针对追问给出正确答案，不要重复老答案。
    - ⚠️ 卡片里的「⚠️ 需切换课程，直接发新的课程名（如「密码学基础」）」
      只是平台的固定提示，**不要回复课程名**，只回答题目本身。
    - ⚠️ 最重要：题目后面列出的 A、B、C、D 就是**可选项**，选择题必须从这些字母里选一个。
      「学习反馈」里那句"你的回答……/正确做法……"是在评价**上一道旧题**，
      **不要照着它作答**；评价之后标着"第 N 题"的那个才是这次要答的新题。

    【代码题】（题目要求"编写代码""写一段代码""实现某逻辑"等）
    - 目的只是过评分，不追求写出可运行、完整、规范的工程代码。
    - ⚠️ 直接给出代码本身，**绝对不要用 ``` 代码围栏**。飞书会把 ``` 渲染成
      「代码块」，教学平台会因此把整条消息判成"资料"而不是答案（会回一句
      "这看起来是一段资料，不是答案"），等于这题白答。就把代码当普通文字发出去。
    - 代码里一行注释都不要写。
    - 省略一切非必要的东西：不要异常处理、不要参数校验、不要日志、
      不要拆辅助函数、不要设计模式、不要 main 示例；变量名简短直白，
      能看懂就行。写得像学生随手交的作业，而不是正式项目代码或教程。
    - 语言用题目或上下文里出现的那门语言，不要引入题目没提到的库。
    - 代码后面必须紧跟一句话，说明关键几行的作用
      （机器人明确要求"说明关键行的作用"，缺了会被判无效作答）；
      不要逐行讲解，不要写成小作文。
    - 篇幅不设硬限制，以"刚好把题目要求交代清楚"为准，能短不长。
      格式示例（仅示范精简程度 + "不要围栏"，代码内容不要照搬）：
      function transfer(address to, uint amount) public {
          require(balances[msg.sender] >= amount);
          balances[msg.sender] -= amount;
          balances[to] += amount;
      }
      require 校验余额是否够，后两行分别扣减付款方、增加收款方。

    【输出格式】（必须严格遵守）
    - 选择题：**只输出一个选项字母**（A、B、C、D 中的一个）。
      不要输出选项的文字、不要写成"B. xxx"、不要加任何解释或标点。
      例：✅ 回复 `C` ／ ❌ 回复 `C. 默认情况下 uint 是 uint256`
      即使上下文里没看清选项，也要根据题目按知识判断后**只回一个字母**。
    - 判断题：**只输出英文 true 或 false（全小写）**，绝对不要输出中文。
      平台只认 true / false，中文「正确 / 错误」会被判成错误答案。
      例：✅ 回复 `false` ／ ❌ 回复 `错误`、`正确`
    - 简答题：用一两句话准确作答
    - 代码题：按上面【代码题】规则，**直接给纯文本代码（不要 ``` 围栏）** + 一句话说明
    - 只输出要发送的内容本身，不要解释、不要客套、不要复述题目。
  max_tokens: 1000
  temperature: 0.3
  # 单次请求超时（秒）。接口偶发慢，45 秒较合适
  timeout: 45
  # 失败最大重试次数
  max_retries: 3

# 发送设置
reply:
  # 发送前等待的随机延迟（秒），让它看起来更自然
  send_delay_min: 2
  send_delay_max: 6
  # 同一道题只回答一次，避免重复回复
  dedup: true
