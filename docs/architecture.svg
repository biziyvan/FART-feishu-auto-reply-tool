<text x="60" y="506" font-size="13.5" font-weight="600" fill="#4F46E5">External services</text>
<text x="60" y="524" font-size="11" fill="#9CA3AF">all network traffic goes here — nowhere else</text>
<rect x="60" y="528" width="420" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="270.0" y="546.0" font-size="12" font-weight="500" fill="#1A1B23" text-anchor="middle">Feishu / Lark Web</text>
<text x="270.0" y="563.0" font-size="10.5" fill="#9CA3AF" text-anchor="middle">virtual-scrolling chat · rich-text input</text>
<rect x="500" y="528" width="420" height="42" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="710.0" y="546.0" font-size="12" font-weight="500" fill="#1A1B23" text-anchor="middle">LLM API</text>
<text x="710.0" y="563.0" font-size="10.5" fill="#9CA3AF" text-anchor="middle">any OpenAI-compatible endpoint</text>
<text x="40" y="620" font-size="11" fill="#6B7280">The console never drives the browser directly: it launches the engine as a subprocess and reads its log stream.</text>
<text x="40" y="638" font-size="11" fill="#9CA3AF">Engine and logic scripts are separated so reply behaviour can be patched with a ~44 KB update instead of a 54 MB download.</text>
</svg>